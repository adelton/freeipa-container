# from https://forge.fedoraproject.org/freeipa/ipacta/pulls/82

# systemd drop-in override for ipacta inside freeipa-container
#
# freeipa-container's minimal systemd target disables sockets.target
# and does not start journald namespace instances.  This drop-in
# relaxes the corresponding directives so the service starts cleanly.
#
# Install to:
#   /usr/lib/systemd/system/pki-tomcatd@.service.d/container.conf
# or COPY in Dockerfile:
#   COPY pki-tomcatd-container.conf \
#        /usr/lib/systemd/system/pki-tomcatd@.service.d/container.conf

[Unit]
# sockets.target is disabled by the freeipa-container minimal patch.
# Wants= (instead of Requires=) lets the service start without the
# socket; server.py falls back to binding its own sockets.
Requires=
Wants=pki-tomcatd@%i.socket

[Service]
# freeipa-container does not start systemd-journald@ipacta.service.
# Without the namespace instance all log output would be lost.
# Remove LogNamespace so logs go to the default journal (server.py
# already sets SYSLOG_IDENTIFIER=ipacta for filtering).
LogNamespace=

# freeipa-container declares VOLUME ["/tmp"].  PrivateTmp creates a
# private mount namespace that may shadow the container volume.
# Disable it — runtime PEM files fall back to the NSSDB directory
# (export_runtime_certs detects the missing PrivateTmp).
PrivateTmp=no

# Container runtime handles filesystem isolation; the kernel-level
# Protect* directives need CAP_SYS_ADMIN for mount namespaces which
# containers typically lack.  Disable all of them.
ProtectSystem=no
ProtectHome=no
ProtectKernelTunables=no
ProtectControlGroups=no
ProtectKernelLogs=no
ProtectClock=no
ReadWritePaths=

# Sandboxing directives that can also trigger kernel namespace
# operations or seccomp setup requiring unavailable capabilities.
LockPersonality=no
RestrictRealtime=no
MemoryDenyWriteExecute=no
RestrictSUIDSGID=no
SystemCallFilter=
SystemCallErrorNumber=

# The base unit's CapabilityBoundingSet= (empty) drops all caps.
# Re-add the minimum set systemd needs to switch to User=pkiuser
# and that the service may need at runtime.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_NET_BIND_SERVICE
